  <symbol id="ow-shoulder-ball" viewBox="0 0 24 32" shape-rendering="crispEdges"><rect x="6" y="9" width="3" height="3" fill="var(--rig-secondary)"></rect><rect x="15" y="9" width="3" height="3" fill="var(--rig-secondary)"></rect><rect x="7" y="10" width="1" height="1" fill="var(--rig-glow)"></rect><rect x="16" y="10" width="1" height="1" fill="var(--rig-glow)"></rect></symbol>
  <symbol id="ow-shoulder-pauldron" viewBox="0 0 24 32" shape-rendering="crispEdges"><rect x="5" y="9" width="4" height="1" fill="var(--rig-highlight)"></rect><rect x="5" y="10" width="4" height="2" fill="var(--rig-primary)"></rect><rect x="15" y="9" width="4" height="1" fill="var(--rig-highlight)"></rect><rect x="15" y="10" width="4" height="2" fill="var(--rig-primary)"></rect><rect x="6" y="12" width="2" height="1" fill="var(--rig-frame)"></rect><rect x="16" y="12" width="2" height="1" fill="var(--rig-frame)"></rect></symbol>
</svg>
