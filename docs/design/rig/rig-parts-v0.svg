  <symbol id="ow-head-dome" viewBox="0 0 24 32" shape-rendering="crispEdges"><rect x="8" y="1" width="1" height="2" fill="var(--rig-secondary)"></rect><rect x="15" y="1" width="1" height="2" fill="var(--rig-secondary)"></rect><rect x="10" y="1" width="4" height="1" fill="var(--rig-primary)"></rect><rect x="9" y="2" width="6" height="1" fill="var(--rig-primary)"></rect><rect x="8" y="3" width="8" height="4" fill="var(--rig-primary)"></rect><rect x="8" y="4" width="8" height="2" fill="var(--rig-visor)"></rect><rect x="9" y="4" width="6" height="2" fill="var(--rig-glow)"></rect><rect x="9" y="7" width="6" height="1" fill="var(--rig-secondary)"></rect></symbol>
