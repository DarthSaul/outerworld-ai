<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="display:none">
<!-- v0 card rig parts on the 24x32 unit grid: body-idle, body-active, head-dome, head-wedge, head-crest, shoulder-ball, shoulder-pauldron. Hand-placed rects, CSS-variable fills. Proportion study, not final. -->

  <symbol id="ow-body-idle" viewBox="0 0 24 32" shape-rendering="crispEdges"><rect x="11" y="8" width="2" height="1" fill="var(--rig-frame)"></rect><rect x="9" y="9" width="6" height="1" fill="var(--rig-highlight)"></rect><rect x="9" y="10" width="6" height="8" fill="var(--rig-primary)"></rect><rect x="9" y="11" width="1" height="5" fill="var(--rig-secondary)"></rect><rect x="14" y="11" width="1" height="5" fill="var(--rig-secondary)"></rect><rect x="10" y="16" width="4" height="2" fill="var(--rig-secondary)"></rect><rect x="9" y="18" width="6" height="1" fill="var(--rig-frame)"></rect><rect x="6" y="12" width="2" height="4" fill="var(--rig-secondary)"></rect><rect x="16" y="12" width="2" height="4" fill="var(--rig-secondary)"></rect><rect x="6" y="16" width="2" height="1" fill="var(--rig-glow)"></rect><rect x="16" y="16" width="2" height="1" fill="var(--rig-glow)"></rect><rect x="6" y="17" width="2" height="5" fill="var(--rig-primary)"></rect><rect x="16" y="17" width="2" height="5" fill="var(--rig-primary)"></rect><rect x="6" y="22" width="2" height="2" fill="var(--rig-frame)"></rect><rect x="16" y="22" width="2" height="2" fill="var(--rig-frame)"></rect><rect x="8" y="19" width="3" height="5" fill="var(--rig-primary)"></rect><rect x="13" y="19" width="3" height="5" fill="var(--rig-primary)"></rect><rect x="8" y="24" width="3" height="1" fill="var(--rig-frame)"></rect><rect x="13" y="24" width="3" height="1" fill="var(--rig-frame)"></rect><rect x="9" y="24" width="1" height="1" fill="var(--rig-glow)"></rect><rect x="14" y="24" width="1" height="1" fill="var(--rig-glow)"></rect><rect x="8" y="25" width="3" height="5" fill="var(--rig-secondary)"></rect><rect x="13" y="25" width="3" height="5" fill="var(--rig-secondary)"></rect><rect x="9" y="26" width="1" height="3" fill="var(--rig-primary)"></rect><rect x="14" y="26" width="1" height="3" fill="var(--rig-primary)"></rect><rect x="7" y="30" width="4" height="2" fill="var(--rig-frame)"></rect><rect x="13" y="30" width