name: CI

# Enforces CONSTRAINTS.md on every change. Stages mirror the root check scripts:
# check:fast (lint, types) → check:task (+ secrets, floor guard, tests with coverage) → check:full (+ build).
# The axe run against a served apps/web joins in the web step.

on:
  push:
    branches: [main, init]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  quality:
    name: Lint, types, floor, tests, build
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The floor guard diffs against the merge base with main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # Reads the pnpm version from package.json "packageManager".

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Floor guard
        run: node scripts/floor-guard.mjs --base origin/main

      - name: Test (Vitest, coverage thresholds in core and generator)
        run: pnpm test

      - name: Build
        run: pnpm build
